<!DOCTYPE html>
<html lang="en" data-base-url="{{ base_url }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default(site.description, true) | e }}">
  <title>{% if page.title is present and page.title != site.title %}{{ page.title | e }} &middot; {% endif %}{{ site.title | e }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ base_url }}/favicon.svg">
  {{ og_all_tags }}
  {{ canonical_tag }}
  {{ jsonld }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  {{ highlight_css }}
  <link rel="stylesheet" href="{{ base_url }}/css/style.css">
  {{ auto_includes_css }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="palette" id="search-modal" role="dialog" aria-modal="true" aria-label="Search the wiki" hidden>
    <div class="palette-scrim" data-search-close></div>
    <div class="palette-panel">
      <div class="palette-field">
        <input type="text" id="search-input" class="palette-input" placeholder="Search dyes, cloths, seams" autocomplete="off" spellcheck="false" aria-label="Search the wiki" aria-controls="search-results" role="combobox" aria-expanded="true" aria-autocomplete="list">
        <kbd>Esc</kbd>
      </div>
      <ul id="search-results" class="palette-results" role="listbox" aria-label="Search results"></ul>
      <p class="palette-note" id="search-hint">Try a plant, a mordant, or a colour. Arrow keys move, Enter opens.</p>
      <p class="palette-note" id="search-empty" hidden>Nothing in the cloth matches that.</p>
    </div>
  </div>

  <header class="site-head">
    <a class="brand" href="{{ base_url }}/">
      <svg class="brand-mark" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
        <rect class="m-seam" width="18" height="18"/>
        <rect class="m-a" x="1" y="1" width="9" height="11"/>
        <rect class="m-b" x="11" y="1" width="6" height="6"/>
        <rect class="m-c" x="11" y="8" width="6" height="4"/>
        <rect class="m-d" x="1" y="13" width="5" height="4"/>
        <rect class="m-e" x="7" y="13" width="10" height="4"/>
      </svg>
      <span>{{ site.title | e }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ base_url }}/dyes/">Dyes</a>
      <a href="{{ base_url }}/cloth/">Cloth</a>
      <button type="button" id="search-trigger" class="search-trigger" aria-haspopup="dialog" aria-controls="search-modal">
        <span>Search</span> <kbd>&#8984;K</kbd>
      </button>
    </nav>
  </header>
