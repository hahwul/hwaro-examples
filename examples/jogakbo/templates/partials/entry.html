<li class="entry dye-{{ p.extra.dye | default("ink") }}">
  <span class="entry-swatch"{% if p.extra.hangul %} lang="ko"{% endif %} aria-hidden="true">{{ p.extra.hangul }}</span>
  <a class="entry-body" href="{{ base_url }}{{ p.url }}">
    <span class="entry-title">{{ p.title }}</span>
    {% if p.description %}<span class="entry-line">{{ p.description }}</span>{% endif %}
  </a>
  <span class="entry-tail">{% if p.extra.season %}{{ p.extra.season }}{% endif %}</span>
</li>
