{% include "header.html" %}
<main id="main" class="leaf">
  <div class="prose">
    <header class="leaf-head">
      {% if page.extra.kanji %}<p class="leaf-kanji" lang="ja" aria-hidden="true">{{ page.extra.kanji }}</p>{% endif %}
      <h1>{{ page.title | e }}</h1>
    </header>
    {{ content | safe }}
    <form class="search-form" role="search" data-index="{{ base_url }}/search.json" onsubmit="return false;">
      <label for="search-input">A word, in English or romaji</label>
      <input id="search-input" type="search" autocomplete="off" autofocus>
    </form>
    <p id="search-status" role="status" aria-live="polite"></p>
    <ul id="search-results"></ul>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <script src="{{ base_url }}/js/search.js"></script>
</main>
{% include "footer.html" %}
