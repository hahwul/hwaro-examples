<nav class="spines" aria-label="Seasons">
  <ol>
    {% for p in get_section(path="seasons").pages | sort_by("weight") %}
    <li>
      <a class="spine" href="{{ base_url }}{{ p.url }}"{% if page.url == p.url %} aria-current="page"{% endif %}>
        <span class="spine-no" lang="ja" aria-hidden="true">{{ p.extra.numeral }}</span>
        <span class="spine-kanji" lang="ja">{{ p.extra.kanji }}</span>
        <span class="spine-kigo" lang="ja">{{ p.extra.kigo }}</span>
        <span class="spine-en">{{ p.title }}</span>
      </a>
    </li>
    {% endfor %}
  </ol>
</nav>
