<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default(site.description, true) | e }}">
  <title>{% if page.title is present and page.title != site.title %}{{ page.title | e }} &middot; {% endif %}{{ site.title | e }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ base_url }}/favicon.svg">
  {{ og_all_tags }}
  {{ canonical_tag }}
  {{ jsonld }}
  <script>
    {% raw %}(function () {
      try {
        var t = localStorage.getItem('theblue-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();{% endraw %}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ base_url }}/css/style.css">
  {{ highlight_css }}
  {{ auto_includes_css }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-head">
    <div class="head-inner">
      <div class="brand-group">
        <a class="brand" href="{{ base_url }}/">
          <span class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <circle cx="12" cy="12" r="4" fill="currentColor" />
            </svg>
          </span>
          <span class="brand-name">{{ site.title | e }}</span>
        </a>
        <div class="tape-counter" aria-label="Tape counter datum">
          <span class="tape-led">TAPE 04154</span>
          <span class="tape-ips">15 IPS · NAB</span>
        </div>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ base_url }}/episodes/">Episodes</a>
        <a href="{{ base_url }}/about/">Acoustics</a>
        <a href="{{ base_url }}/tags/">Index</a>
        <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle color theme">
          <span class="theme-icon" aria-hidden="true">◑</span>
        </button>
      </nav>
    </div>
  </header>
