<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default(site.description, true) | e }}">
  <title>{% if page.title is present and page.title != site.title %}{{ page.title | e }} &middot; {% endif %}{{ site.title | e }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ base_url }}/favicon.svg">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | e }} releases" href="{{ base_url }}/releases/rss.xml">
  {{ og_all_tags }}
  {{ canonical_tag }}
  {{ jsonld }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&family=Zen+Old+Mincho:wght@400;600&display=swap" rel="stylesheet">
  {{ highlight_css }}
  <link rel="stylesheet" href="{{ base_url }}/css/style.css">
  {{ auto_includes_css }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include "partials/sprite.html" %}
  <header class="site-head wrap">
    <a class="brand" href="{{ base_url }}/"><span class="brand-ja" lang="ja">継ぎ</span><span class="brand-name">tsugi</span></a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ base_url }}/releases/">Releases</a>
      <a href="{{ base_url }}/about/">About</a>
      <a href="{{ base_url }}/releases/rss.xml">Feed</a>
    </nav>
  </header>
