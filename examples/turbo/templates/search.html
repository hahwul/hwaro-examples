{% include "header.html" %}
<main id="main" class="desktop">
  <section class="dialog dialog-find" aria-labelledby="find-title">
    <h1 class="dialog-title" id="find-title">{{ page.title | e }}</h1>
    <form role="search" data-index="{{ base_url }}/search.json" onsubmit="return false;">
      <label for="search-input">Text to find</label>
      <input id="search-input" type="search" autocomplete="off" spellcheck="false" autofocus>
    </form>
    <p id="search-status" role="status" aria-live="polite">Type a part number, a symptom, or a file name.</p>
  </section>
  <section class="win win-main win-results" aria-label="Results">
    <p class="win-bar"><span aria-hidden="true">[&#9632;]</span><span>FIND.OUT</span><span aria-hidden="true">2</span></p>
    <ul id="search-results" class="dir dir-find"></ul>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <script src="{{ base_url }}/js/search.js"></script>
</main>
{% include "footer.html" %}
