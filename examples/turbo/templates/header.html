<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default(site.description, true) | e }}">
  <title>{% if page.title is present and page.title != site.title %}{{ page.title | e }} &middot; {% endif %}{{ site.title | e }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ base_url }}/favicon.svg">
  {{ og_all_tags }}
  {{ canonical_tag }}
  {{ jsonld }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=VT323&display=swap" rel="stylesheet">
  {{ highlight_css }}
  <link rel="stylesheet" href="{{ base_url }}/css/style.css">
  {{ auto_includes_css }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <svg class="desk" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse">
        <rect width="2" height="2"/><rect x="4" y="4" width="2" height="2"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#dither)"/>
  </svg>
  <header class="bar menubar">
    <nav aria-label="Primary">
      <a class="menu-sys" href="{{ base_url }}/" aria-label="Turbo, home">&#8801;</a>
      <a href="{{ base_url }}/log/" accesskey="l"><b>L</b>og</a>
      <a href="{{ base_url }}/tags/" accesskey="t"><b>T</b>ags</a>
      <a href="{{ base_url }}/about/" accesskey="a"><b>A</b>bout</a>
      <a href="{{ base_url }}/search/" accesskey="s"><b>S</b>earch</a>
    </nav>
    <p class="bar-id" aria-hidden="true">386DX-33 <span>4096K</span> <span class="led"></span> Turbo</p>
  </header>
