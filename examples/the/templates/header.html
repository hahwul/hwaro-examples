<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default(site.description, true) | e }}">
  <title>{% if page.title is present and page.title != site.title %}{{ page.title | e }} &middot; {% endif %}{{ site.title | e }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ base_url }}/favicon.svg">
  {{ og_all_tags }}
  {{ canonical_tag }}
  {{ jsonld }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;600;700;800;900&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ base_url }}/css/style.css">
  {{ highlight_css }}
  {{ auto_includes_css }}
  <script>
    {% raw %}(function () {
      try {
        var t = localStorage.getItem('the-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();{% endraw %}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="masthead-band">
    <div class="masthead-brand">
      {% if page.url == "/" or page.title == site.title %}
        <h1 class="site-title"><a href="{{ base_url }}/">{{ site.title | e }}</a></h1>
      {% else %}
        <div class="site-title"><a href="{{ base_url }}/">{{ site.title | e }}</a></div>
      {% endif %}
      <span class="issue-meta-tag">Summer 2026</span>
    </div>
    <div class="masthead-controls">
      <nav class="masthead-nav" aria-label="Primary">
        <a href="{{ base_url }}/issues/">Issues</a>
        <a href="{{ base_url }}/about/">About</a>
        <a href="{{ base_url }}/tags/">Tags</a>
      </nav>
      <div class="masthead-buttons">
        <button id="search-trigger" class="btn-icon" type="button" aria-label="Search">Search <kbd>/</kbd></button>
        <button id="theme-toggle" class="btn-icon" type="button" aria-label="Toggle theme">
          <span class="theme-toggle-icon" aria-hidden="true">◐</span>
        </button>
      </div>
    </div>
  </header>
