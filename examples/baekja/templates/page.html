{% include "header.html" %}
<main id="main">
  <article class="spread{% if not page.extra.diagram %} spread-solo{% endif %}">
    {% if page.extra.diagram %}
    <figure class="plate">
      {% include "partials/halves.html" %}
      <figcaption>Two bowls, rim to rim. The line where they meet never disappears.</figcaption>
    </figure>
    {% endif %}

    <div class="leaf">
      {% if page.extra.folio %}<p class="folio">{{ page.extra.folio }}</p>{% endif %}
      <h1>{{ page.title | e }}</h1>
      {% if page.description %}<p class="leaf-lede">{{ page.description }}</p>{% endif %}
      <div class="prose">
        {{ content | safe }}
      </div>
    </div>
  </article>
</main>
{% include "footer.html" %}
