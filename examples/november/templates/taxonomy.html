{% include "header.html" %}
<main id="main">
  <div class="main-body">
    <header class="section-header">
      <h1 class="section-title">Seasonal Tags Index</h1>
    </header>
    {% set tax = get_taxonomy(kind="tags") %}
    <div class="colophon-tags" style="flex-wrap: wrap; gap: var(--space-3);">
      {% for term in tax.items | sort_by("name") %}
      <a class="tag-pill" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" href="{{ get_taxonomy_url(kind="tags", term=term.name) }}">
        {{ term.name }} <span style="color: var(--muted); opacity: 0.8;">({{ term.pages | length }})</span>
      </a>
      {% endfor %}
    </div>
  </div>
</main>
{% include "footer.html" %}
