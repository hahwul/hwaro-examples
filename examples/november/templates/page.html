{% include "header.html" %}
<main id="main">
  <div class="main-body">
    <article class="prose">
      <h1>{{ page.title | e }}</h1>
      {% if page.date %}
      <div class="lead-byline" style="margin-bottom: var(--space-4);">
        Published <time datetime="{{ page.date }}">{{ page.date | date("%B %d, %Y") }}</time>
      </div>
      {% endif %}
      {{ content | safe }}
      {% if page.tags %}
      <div class="colophon-tags" style="margin-top: var(--space-5); border-top: 1px solid var(--border); padding-top: var(--space-3);">
        <span style="font-family: var(--font-mono); font-size: var(--text-sm); color: var(--muted);">Tags:</span>
        {% for t in page.tags %}
        <a class="tag-pill" href="{{ get_taxonomy_url(kind="tags", term=t) }}">{{ t }}</a>
        {% endfor %}
      </div>
      {% endif %}
    </article>
  </div>
</main>
{% include "footer.html" %}
